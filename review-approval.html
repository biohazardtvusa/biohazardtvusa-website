<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Review approval | BiohazardTvUSA</title><style>
:root{color-scheme:dark;--gold:#d9ad45;--ink:#111;--panel:#1c1c1c;--text:#f7f4ea;--muted:#c6c1b4}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:16px/1.6 system-ui,sans-serif}.wrap{max-width:720px;margin:0 auto;padding:32px 20px}main{background:var(--panel);border:1px solid #39342a;border-radius:18px;padding:28px}h1{margin-top:0}.review{white-space:pre-wrap;border-left:3px solid var(--gold);padding:12px 16px;background:#151515;border-radius:8px}.muted{color:var(--muted)}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.approve{background:var(--gold);color:#111}.reject{background:#612f2f;color:#fff}.status{min-height:28px;color:var(--gold)}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style></head><body><div class="wrap"><main><h1>Review approval</h1><p class="muted">Check the review before confirming your decision.</p><p id="status" class="status" aria-live="polite">Loading review…</p><section id="details" hidden><p><strong>Name:</strong> <span id="name"></span></p><p id="review" class="review"></p><button id="confirm" class="approve" type="button">Confirm approval</button><button id="cancel" class="reject" type="button">Confirm rejection</button></section><p><a href="/" style="color:var(--gold)">Return to BiohazardTvUSA</a></p></main></div><script>
const params=new URLSearchParams(location.search);const token=params.get('token');const decision=params.get('decision');const statusEl=document.getElementById('status');const details=document.getElementById('details');const approveButton=document.getElementById('confirm');const rejectButton=document.getElementById('cancel');
function showError(message){statusEl.textContent=message;details.hidden=true;}
if(!token||!['approve','reject'].includes(decision)){showError('This approval link is incomplete.');}else{fetch('/.netlify/functions/review-action?token='+encodeURIComponent(token)).then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'This link cannot be used.');document.getElementById('name').textContent=data.review.name;document.getElementById('review').textContent=data.review.review;details.hidden=false;approveButton.hidden=decision!=='approve';rejectButton.hidden=decision!=='reject';statusEl.textContent=decision==='approve'?'Ready to approve this review?':'Ready to reject this review?';}).catch(error=>showError(error.message||'This link cannot be used.'));}
async function decide(choice){approveButton.disabled=true;rejectButton.disabled=true;statusEl.textContent='Saving your decision…';try{const response=await fetch('/.netlify/functions/review-action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,decision:choice})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to save your decision.');statusEl.textContent=data.status==='approved'?'Approved. This review will appear on the website.':'Rejected. This review will not appear on the website.';details.hidden=true;}catch(error){statusEl.textContent=error.message||'Unable to save your decision.';approveButton.disabled=false;rejectButton.disabled=false;}}
approveButton.addEventListener('click',()=>decide('approve'));rejectButton.addEventListener('click',()=>decide('reject'));
</script></body></html>

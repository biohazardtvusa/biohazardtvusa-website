<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Unsubscribe | BIOHAZARDTVUSA</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0c10;color:#f7f1e5;font:16px/1.65 Arial,sans-serif}main{width:min(620px,100%);margin:auto;padding:40px 22px 64px}a{color:#e6bd62;overflow-wrap:anywhere}h1{font-size:clamp(28px,6vw,40px);line-height:1.25}.card{margin-top:26px;padding:24px;border:1px solid #35302a;border-radius:16px;background:#16171d}p{color:#b4b0a8}.btn{display:inline-block;padding:14px 20px;border:1px solid #e6bd62;border-radius:10px;background:#e6bd62;color:#151515;font:700 16px Arial,sans-serif;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}#status{min-height:1.6em;overflow-wrap:anywhere}:focus-visible{outline:3px solid #e6bd62;outline-offset:4px}
</style>
</head>
<body>
<main>
<a href="/">BIOHAZARDTVUSA &middot; BIOHAZARD MEDIA</a>
<section class="card">
<h1>Unsubscribe from marketing</h1>
<p>Click below to stop receiving BIOHAZARDTVUSA marketing emails. This does not cancel TV service.</p>
<form id="unsubscribe-form">
<button class="btn" id="unsubscribe-button" type="submit">Unsubscribe from marketing</button>
</form>
<p id="status" role="status" aria-live="polite">You can still contact us about your service at any time.</p>
<p><a href="/">Return to BIOHAZARDTVUSA</a></p>
</section>
</main>
<script>
(() => {
  const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
  history.replaceState(null, '', location.pathname);
  const form = document.getElementById('unsubscribe-form');
  const button = document.getElementById('unsubscribe-button');
  const status = document.getElementById('status');
  if (!/^[a-f0-9]{64}$/.test(token)) {
    button.disabled = true;
    status.textContent = 'This unsubscribe link is missing or invalid. You can email Biohazardtvusa@gmail.com for help.';
    return;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    status.textContent = 'Updating your email preferences…';
    try {
      const endpoint = '/.netlify/functions/newsletter?action=one-click-unsubscribe&token=' + encodeURIComponent(token);
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { accept: 'application/json', 'content-type': 'application/x-www-form-urlencoded' },
        body: 'List-Unsubscribe=One-Click'
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || 'We could not update your preferences. Please try again.');
      button.hidden = true;
      status.textContent = body.message;
    } catch (error) {
      status.textContent = error.message || 'We could not update your preferences. Please try again.';
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
